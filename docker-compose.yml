services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  service-a:
    build:
      context: .
      dockerfile: service-a/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-orders_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
  service-b-1:
    build:
      context: .
      dockerfile: service-b/Dockerfile
    environment:
      INSTANCE_NAME: service-b-1
    networks: [backend]
  service-b-2:
    build:
      context: .
      dockerfile: service-b/Dockerfile
    environment:
      INSTANCE_NAME: service-b-2
    networks: [backend]
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [service-a, service-b-1, service-b-2]
    networks: [backend]
volumes:
  postgres_data:
networks:
  backend:
    driver: bridge

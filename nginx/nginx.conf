events {}
http {
  upstream order_api { server service-a:8081; }
  upstream processing_api {
    least_conn;
    server service-b-1:8082;
    server service-b-2:8082;
  }
  server {
    listen 80;
    location /api/orders/ { proxy_pass http://order_api/api/orders/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /api/orders { proxy_pass http://order_api/api/orders; proxy_set_header Host $host; }
    location /api/process/ { proxy_pass http://processing_api/api/process/; proxy_set_header Host $host; }
    location = /api/process { proxy_pass http://processing_api/api/process; proxy_set_header Host $host; }
    location /nginx-health { return 200 'nginx UP'; add_header Content-Type text/plain; }
  }
}
